mode: pipeline  # "pipeline" (full voting round) or "query" (single personalized query)

llm:
  path: openrouter-google/gemma-4-31b-it
  is_api: true              # true for API models, false for local
  backend: transformers     # "transformers" or "vllm" (ignored when is_api=true)
  temperature: 0.0
  top_p: 1.0

region:
  description: "Southern Ontario Canada"
  num_districts: 5
  cache_path: "dataset/regions"

pipeline:
  num_voters: 100
  max_workers: 5                 # max concurrent LLM calls (keep low for API rate limits)
  topic: "social"
  parties:
    - liberal
    - conservative
    - socialist
  voting_system: "fptp"         # primary system for single-election result
  voting_systems:                # systems for comparative policy ranking
    - fptp
    - smdp
    - alternative_vote
    - dhondt
    - hare
    - sainte_lague
  max_rank: 3                    # number of parties each voter ranks
  results_dir: "results"         # output dir for per-model ranking JSON
  deliberation:
    enabled: true                # toggle parliamentary deliberation phase
    max_rounds: 3                # maximum bill consideration attempts

political_questions:
  path: "dataset/political_questions/political-questions.csv"
  topic: "social"

