debug: false  # true = 10 voters, 2 parties, 2 systems, verbose LLM output
mode: pipeline  # "pipeline" | "query" | "compare" | "judge"

llm:
  path: openrouter-google/gemma-4-31b-it
  is_api: true              # true for API models, false for local
  backend: transformers     # "transformers" or "vllm" (ignored when is_api=true)
  temperature: 0.0
  top_p: 1.0

region:
  description: "Southern Ontario Canada"
  num_districts: 5
  cache_path: "dataset/regions"

pipeline:
  voting_mode: "issue"           # "issue" (default) or "platform" (rank by party platforms once) or "survey"
  num_voters: 120
  personas_path: "dataset/personas/personas.json"  # cached persona set (created on first run); non-default files (e.g. personas_635.json) automatically tag output filenames (e.g. divisive-12.issue.p635.<model>.json)
  max_workers: 5                 # max concurrent LLM calls (keep low for API rate limits)
  topic: "social"
  parties:
    - liberal
    - conservative
    - socialist
    - green
    - left
    - populist
  voting_system: "sntv"          # primary system for single-election result
  voting_systems:                # systems for comparative policy ranking
    - sntv
    - fptp
    - alternative_vote
    - trs
    - dhondt
    - sainte_lague
    - stv
  max_rank: 6                    # number of parties each voter ranks
  results_dir: "results"         # output dir for per-model ranking JSON
  deliberation:
    enabled: true                # toggle parliamentary deliberation phase
    max_rounds: 5                # maximum bill consideration attempts

political_questions:
  dataset: "divisive-12"          # one of: diverse-12, diverse-20, harm-12, harm-20, legacy
  # question_indices: [0, 3, 7]  # optional: 0-based indices to sample from; omit for all

judge:
  source_model: openrouter-google/gemma-4-31b-it  # model whose results to judge
  source_mode: "issue"                             # "issue" or "platform"
  results_dir: "results"                           # where to read input / write output
  max_workers: 5                                   # concurrent pairwise comparisons
