mode: pipeline  # "pipeline" (full voting round) or "query" (single personalized query)

llm:
  path: mistralai/Mistral-7B-Instruct-v0.2
  temperature: 0.0
  top_p: 1.0

prompt: "What is the capital of France?"

region:
  description: "Southern Ontario Canada"
  num_districts: 5
  cache_path: "dataset/regions"

pipeline:
  num_voters: 100
  topic: "social"
  parties:
    - liberal
    - conservative
    - socialist
  voting_system: "fptp"   # "fptp" or "dhondt"
  max_rank: 3             # number of parties each voter ranks

political_questions:
  path: "dataset/political_questions/political-questions.csv"
  topic: "social"

